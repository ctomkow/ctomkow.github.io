<!doctype html>
<html lang="en">
	<body>
		<h3>
		CraigCloud Status Page
		</h3>
		<ul>
			{% for file in site.data %}
				{% if file[1] == 200 %}
					<li style="list-style-type: '\1F7E2'">{{ file[0] }}: {{ file[1] | strip }}</li>
				{% else %}
					<li style="list-style-type: '\1F534'">{{ file[0] }}: {{ file[1] | strip }}</li>
				{% endif %}
			{% endfor %}
		</ul>
	</body>
</html>
